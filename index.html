<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmLand - Fresh Organic Produce</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Shop fresh organic fruits, vegetables, and produce. High-quality, pesticide-free products delivered to your door." />
    <meta name="keywords" content="organic, produce, fruits, vegetables, fresh, healthy, farm, organic food" />
    <meta name="author" content="FarmLand Team" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FarmLand - Fresh Organic Produce" />
    <meta property="og:description" content="Shop fresh organic fruits, vegetables, and produce. High-quality, pesticide-free products delivered to your door." />
    <meta property="og:site_name" content="FarmLand" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FarmLand - Fresh Organic Produce" />
    <meta name="twitter:description" content="Shop fresh organic fruits, vegetables, and produce. High-quality, pesticide-free products delivered to your door." />
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FarmLand",
      "description": "Fresh organic produce marketplace",
      "url": "https://farmland.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://farmland.com/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
